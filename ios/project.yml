name: StepSafe
options:
  bundleIdPrefix: net.babigian
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: SZ3BW48YVT
    CODE_SIGN_STYLE: Automatic
targets:
  StepSafe:
    type: application
    platform: iOS
    sources:
      - StepSafe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.babigian.stepsafe
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: StepSafe/Info.plist
      properties:
        CFBundleDisplayName: StepSafe
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arkit]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        NSCameraUsageDescription: StepSafe uses the camera and LiDAR to find obstacles, head-height hazards and drop-offs in your path.
        NSLocationWhenInUseUsageDescription: StepSafe uses your location to place hazards on the community map and warn you about hazards ahead.
        NSMotionUsageDescription: StepSafe uses motion sensors to track where your head is pointing so warnings come from the right direction.
    scheme:
      testTargets:
        - StepSafeTests
  # Logic tests with no host app: PathGuard and Tuning are compiled straight in,
  # so the tests run on a simulator without ARKit.
  StepSafeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - StepSafeTests
      - StepSafe/Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.babigian.stepsafe.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
